{% extends "base.html" %}

{% block content %}
  <h1>Delete Driver</h1>
  <p>Are you sure you want to delete the driver: {{ driver }}?</p>
  <form action="" method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit" >Delete</button>
    <a class="btn btn-primary" href="{% url 'taxi:driver-detail' pk=driver.id %}">
      Cancel
    </a>
  </form>
{% endblock %}
